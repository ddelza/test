<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <base target="_top" />
  <title>학생 건의함 - 관리자</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* 비밀번호 잠금 화면 */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      padding: 36px 28px;
      text-align: center;
    }

    .lock-icon {
      width: 52px;
      height: 52px;
      background-color: #eef2ff;
      color: #4f46e5;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .login-card h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .pw-input {
      width: 100%;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 16px;
      text-align: center;
      letter-spacing: 4px;
      background-color: #f8fafc;
      margin-bottom: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .pw-input:focus {
      outline: none;
      border-color: #4f46e5;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn-primary {
      width: 100%;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: #4338ca;
    }

    .btn-primary:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .login-error {
      display: none;
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* 관리자 대시보드 */
    .dashboard {
      display: none;
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .topbar-title h1 {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
    }

    .topbar-title span {
      font-size: 13px;
      color: #64748b;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn-outline {
      background-color: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-outline:hover {
      background-color: #f8fafc;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      border: 1px solid #e2e8f0;
    }

    .stat-label {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      color: #4f46e5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: #0f172a;
    }

    .search-input:focus {
      outline: none;
      border-color: #4f46e5;
    }

    .sort-select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: #334155;
      font-weight: 600;
      cursor: pointer;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .suggestion-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px 22px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      transition: box-shadow 0.15s;
    }

    .suggestion-card:hover {
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.07);
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .author-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .num-badge {
      background-color: #eef2ff;
      color: #4f46e5;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .author-name {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .timestamp {
      font-size: 12px;
      color: #94a3b8;
    }

    .card-content {
      font-size: 15px;
      line-height: 1.65;
      color: #334155;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-state {
      background: #ffffff;
      border-radius: 14px;
      padding: 48px 20px;
      text-align: center;
      color: #64748b;
      font-size: 15px;
      border: 1px dashed #cbd5e1;
    }
  </style>
</head>
<body>
  <!-- 로그인 화면 -->
  <div id="loginSection" class="login-wrapper">
    <div class="login-card">
      <div class="lock-icon">🔒</div>
      <h1>관리자 페이지</h1>
      <p>건의함 내용을 확인하려면 비밀번호를 입력하세요.</p>

      <div id="loginError" class="login-error"></div>

      <form id="loginForm">
        <input
          type="password"
          id="passwordInput"
          class="pw-input"
          placeholder="••••"
          autocomplete="off"
          required
        />
        <button type="submit" id="loginBtn" class="btn-primary">확인</button>
      </form>
    </div>
  </div>

  <!-- 대시보드 화면 -->
  <div id="dashboardSection" class="dashboard">
    <div class="topbar">
      <div class="topbar-title">
        <h1>학생 건의함 모아보기</h1>
        <span>접수된 학생 의견을 한눈에 확인할 수 있습니다.</span>
      </div>
      <div class="topbar-actions">
        <button type="button" id="refreshBtn" class="btn-outline">새로고침</button>
        <button type="button" id="logoutBtn" class="btn-outline">잠금</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">전체 건의사항</div>
        <div class="stat-value" id="totalCount">0건</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">오늘 접수된 건의</div>
        <div class="stat-value" id="todayCount">0건</div>
      </div>
    </div>

    <div class="controls">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="이름, 별명 또는 건의 내용 검색..."
      />
      <select id="sortSelect" class="sort-select">
        <option value="newest">최신순 보기</option>
        <option value="oldest">오래된순 보기</option>
      </select>
    </div>

    <div id="cardList" class="card-list"></div>
  </div>

  <script>
    let currentPassword = '';
    let allSuggestions = [];

    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    const totalCountEl = document.getElementById('totalCount');
    const todayCountEl = document.getElementById('todayCount');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const cardList = document.getElementById('cardList');
    const refreshBtn = document.getElementById('refreshBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pw = passwordInput.value.trim();
      if (!pw) return;

      loginError.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = '확인 중...';

      fetchSuggestions(pw, true);
    });

    refreshBtn.addEventListener('click', () => {
      refreshBtn.disabled = true;
      refreshBtn.textContent = '불러오는 중...';
      fetchSuggestions(currentPassword, false);
    });

    logoutBtn.addEventListener('click', () => {
      currentPassword = '';
      allSuggestions = [];
      passwordInput.value = '';
      searchInput.value = '';
      dashboardSection.style.display = 'none';
      loginSection.style.display = 'flex';
    });

    searchInput.addEventListener('input', renderList);
    sortSelect.addEventListener('change', renderList);

    function fetchSuggestions(password, isInitialLogin) {
      google.script.run
        .withSuccessHandler((data) => {
          currentPassword = password;
          allSuggestions = data || [];

          if (isInitialLogin) {
            loginBtn.disabled = false;
            loginBtn.textContent = '확인';
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
          } else {
            refreshBtn.disabled = false;
            refreshBtn.textContent = '새로고침';
          }

          updateStats();
          renderList();
        })
        .withFailureHandler((err) => {
          if (isInitialLogin) {
            loginBtn.disabled = false;
            loginBtn.textContent = '확인';
            loginError.textContent = err.message || '비밀번호가 올바르지 않습니다.';
            loginError.style.display = 'block';
            passwordInput.select();
          } else {
            refreshBtn.disabled = false;
            refreshBtn.textContent = '새로고침';
            alert(err.message || '데이터를 불러오지 못했습니다.');
          }
        })
        .getSuggestions(password);
    }

    function updateStats() {
      totalCountEl.textContent = allSuggestions.length + '건';

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const todayPrefix = `${yyyy}-${mm}-${dd}`;

      const todayCount = allSuggestions.filter(item =>
        String(item.timestamp).startsWith(todayPrefix)
      ).length;

      todayCountEl.textContent = todayCount + '건';
    }

    function renderList() {
      const keyword = searchInput.value.trim().toLowerCase();
      const sortOrder = sortSelect.value;

      let filtered = allSuggestions.filter(item => {
        if (!keyword) return true;
        return (
          String(item.nickname).toLowerCase().includes(keyword) ||
          String(item.content).toLowerCase().includes(keyword)
        );
      });

      if (sortOrder === 'newest') {
        filtered = [...filtered].reverse();
      }

      cardList.innerHTML = '';

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = keyword
          ? '검색어와 일치하는 건의사항이 없습니다.'
          : '아직 등록된 건의사항이 없습니다.';
        cardList.appendChild(empty);
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'suggestion-card';

        const meta = document.createElement('div');
        meta.className = 'card-meta';

        const authorWrap = document.createElement('div');
        authorWrap.className = 'author-wrap';

        const badge = document.createElement('span');
        badge.className = 'num-badge';
        badge.textContent = '#' + item.number;

        const author = document.createElement('span');
        author.className = 'author-name';
        author.textContent = item.nickname || '익명';

        authorWrap.appendChild(badge);
        authorWrap.appendChild(author);

        const time = document.createElement('span');
        time.className = 'timestamp';
        time.textContent = item.timestamp;

        meta.appendChild(authorWrap);
        meta.appendChild(time);

        const content = document.createElement('div');
        content.className = 'card-content';
        content.textContent = item.content;

        card.appendChild(meta);
        card.appendChild(content);
        cardList.appendChild(card);
      });
    }
  </script>
</body>
</html>
